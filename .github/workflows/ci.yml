name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push seguido de push na mesma branch cancela a execução anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Um sistema falhando não cancela os outros — a diferença é o que interessa.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      # Versão exata: o setup-uv não publica tag móvel `v9`, só `v9.0.0`.
      # O Dependabot cuida de subir isso mensalmente.
      - name: Instalar uv e Python 3.14
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Criar o ambiente
        run: uv venv --python 3.14

      - name: Instalar dependências
        run: uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Formatação (ruff)
        run: uv run ruff format --check src tests

      # O código tem caminho por sistema (fcntl/msvcrt, systemd-creds/DPAPI);
      # checar um só deixaria a outra metade sem tipo verificado.
      - name: Tipos (mypy, Linux)
        run: uv run mypy --platform linux

      - name: Tipos (mypy, Windows)
        run: uv run mypy --platform win32

      # Os testes de cifragem local se auto-pulam onde o backend não existe.
      - name: Testes (pytest)
        run: uv run pytest
